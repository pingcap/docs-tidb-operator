name: Links (Fail Fast)

on:
  pull_request:

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install lychee
        shell: bash
        run: |
          archive="$RUNNER_TEMP/lychee-v0.11.1-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/lycheeverse/lychee/releases/download/v0.11.1/lychee-v0.11.1-x86_64-unknown-linux-gnu.tar.gz
          echo "2cb75e6bcaf97f049d4e0260433938a77c60d39bd347d704502ae96c1e6f481c  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"

      - name: Check links in changed Markdown files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' -t changed_files < <(
            git diff-tree --name-only --diff-filter 'AM' -z -r HEAD^1 HEAD -- "zh/*.md" "en/*.md"
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed Markdown files to check."
            exit 0
          fi

          LYCHEE_BIN="$RUNNER_TEMP/lychee" ./hack/check-links.sh "${changed_files[@]}"
