name: ci

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.base_ref }}

jobs:

  check-file-encoding:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: "Check file encoding"
      run: |
        ./hack/download-doc-check.sh check-file-encoding.py
        ./hack/run-doc-check.sh check-file-encoding.py '..' '*.md' ':(exclude).github/*'
  check-git-conflicts:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: "Check git conflicts"
      run: |
        ./hack/download-doc-check.sh check-conflicts.py
        ./hack/run-doc-check.sh check-conflicts.py '..' '*.md' '*.yml' '*.yaml'
  markdownlint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: Markdown lint
      uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1
      with:
        config: './.markdownlint.yaml'
        args: '.'
  verify-internal-links:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Verify internal links
      run: ./hack/verify-links.sh
  verify-internal-link-anchors:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Verify internal link anchors
      run: ./hack/verify-link-anchors.sh
  check-control-characters:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: "Check control characters"
      run: |
        ./hack/download-doc-check.sh check-control-char.py
        ./hack/run-doc-check.sh check-control-char.py '..' '*.md' ':(exclude).github/*'
  check-unclosed-tags:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: "Check unclosed tags"
      run: |
        ./hack/download-doc-check.sh check-tags.py
        ./hack/run-doc-check.sh check-tags.py '...' ':(glob)zh/**/*.md' ':(glob)en/**/*.md'
  check-manual-line-breaks:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '16'
    - name: Add remote
      run: |
        git remote add upstream https://github.com/pingcap/docs-tidb-operator.git
        git fetch upstream
    - name: "Check manual line breaks"
      run: |
        ./hack/download-doc-check.sh check-manual-line-breaks.py
        ./hack/run-doc-check.sh check-manual-line-breaks.py '..' '*.md' ':(exclude).github/*'

  test-ci-file-handling:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Test CI file handling
      run: python3 scripts/test-ci-workflow.py
