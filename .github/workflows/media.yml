name: Upload media files when they change
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch whose media files should be published (run this workflow from main)
        type: choice
        required: true
        default: main
        options:
          - main
          - release-1.x
          - release-1.0
          - release-1.1
          - release-1.2
          - release-1.3
          - release-1.4
          - release-1.5
          - release-1.6
          - release-2.0

permissions:
  contents: read

jobs:
  upload:
    name: Upload media files
    if: >-
      github.repository == 'pingcap/docs-tidb-operator' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == '1' &&
      contains(fromJSON('["30922556","79440533","47792576"]'), github.actor_id)
    runs-on: ubuntu-latest
    steps:
      - name: Authorize production publishing
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR_ID: ${{ github.actor_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          case "$SOURCE_BRANCH" in
            main|release-1.x|release-1.[0-6]|release-2.0) ;;
            *)
              echo "::error::Select an existing publishing branch."
              exit 1
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" |
            jq -e --arg id "$ACTOR_ID" '
              (.user.id | tostring) == $id and
              (.permission == "write" or .permission == "maintain" or .permission == "admin")
            ' > /dev/null

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/${{ inputs.source_branch }}
          persist-credentials: false

      #- name: Configure awscli
      #  run: |
      #    pip3 install --upgrade setuptools
      #    pip3 install awscli
      #    printf "%s\n" ${{ secrets.AWS_ACCESS_KEY }} ${{ secrets.AWS_SECRET_KEY }} ${{ secrets.AWS_REGION }} "json" | aws configure
      - name: Install coscli
        run: |
          curl --fail --location --silent --show-error \
            --output coscli \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          printf '%s  %s\n' 'a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915' coscli | sha256sum --check
          chmod 755 coscli
      - name: Upload to COS
        run: |
          ./coscli sync media/ cos://${{ secrets.TENCENTCLOUD_BUCKET_ID }}/media/images/tidb-in-kubernetes \
            --init-skip \
            --recursive \
            --routines 16 \
            --secret-id ${{ secrets.TENCENTCLOUD_SECRET_ID }} \
            --secret-key ${{ secrets.TENCENTCLOUD_SECRET_KEY }} \
            --endpoint cos.ap-beijing.myqcloud.com

  cdn-refresh:
    needs: upload
    # Require a fresh dispatch if either job fails. A partial rerun can reuse an earlier upload.
    if: >-
      github.repository == 'pingcap/docs-tidb-operator' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == '1' &&
      contains(fromJSON('["30922556","79440533","47792576"]'), github.actor_id)
    runs-on: ubuntu-latest
    name: Refresh CDN Cache
    permissions: {}
    steps:
      - name: Set up Python environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Tencent Cloud CLI
        run: |
          curl --fail --location --silent --show-error \
            --output tccli-3.1.194.1-py2.py3-none-any.whl \
            https://files.pythonhosted.org/packages/db/75/0cc24c0bc1fee2d88ebde777bea01f57a8f5b271eee9fff20f662e5ba32e/tccli-3.1.194.1-py2.py3-none-any.whl
          printf '%s  %s\n' '8d2ab8f4111c5a770aa7d98cbbf01a0cdc378dbecee5ba3e5836312dc12c0ba3' tccli-3.1.194.1-py2.py3-none-any.whl | sha256sum --check
          pipx install ./tccli-3.1.194.1-py2.py3-none-any.whl

      - name: Purge production CDN cache
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tccli cdn PurgePathCache --Paths '["https://docs-download.pingcap.com/media/images/tidb-in-kubernetes/"]' --FlushType delete
