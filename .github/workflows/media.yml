name: Upload media files when they change
on:
  push:
    branches:
      - main
      - release-1.x
      - release-1.0
      - release-1.1
      - release-1.2
      - release-1.3
      - release-1.4
      - release-1.5
      - release-1.6
      - release-2.0
    paths:
      - media/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload media files
    # Environment protection is the security boundary; the manual actor check
    # also prevents accidental dispatches by other repository writers.
    environment: production-media
    if: >-
      github.repository == 'pingcap/docs-tidb-operator' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (github.actor == 'lilin90' || github.actor == 'qiancai') &&
          (github.triggering_actor == 'lilin90' || github.triggering_actor == 'qiancai')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Must use at least depth 2!
          fetch-depth: 2
          persist-credentials: false

      #- name: Configure awscli
      #  run: |
      #    pip3 install --upgrade setuptools
      #    pip3 install awscli
      #    printf "%s\n" ${{ secrets.AWS_ACCESS_KEY }} ${{ secrets.AWS_SECRET_KEY }} ${{ secrets.AWS_REGION }} "json" | aws configure
      - name: Install coscli
        run: |
          curl --fail --location --silent --show-error \
            --output coscli \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          printf '%s  %s\n' 'a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915' coscli | sha256sum --check
          chmod 755 coscli
      - name: Upload to COS
        run: |
          ./coscli sync media/ cos://${{ secrets.TENCENTCLOUD_BUCKET_ID }}/media/images/tidb-in-kubernetes \
            --init-skip \
            --recursive \
            --routines 16 \
            --secret-id ${{ secrets.TENCENTCLOUD_SECRET_ID }} \
            --secret-key ${{ secrets.TENCENTCLOUD_SECRET_KEY }} \
            --endpoint cos.ap-beijing.myqcloud.com

  cdn-refresh:
    needs: upload
    environment: production-media
    # A failed-job re-run may reuse a successful upload without rechecking it.
    if: >-
      github.repository == 'pingcap/docs-tidb-operator' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (github.actor == 'lilin90' || github.actor == 'qiancai') &&
          (github.triggering_actor == 'lilin90' || github.triggering_actor == 'qiancai')
        )
      )
    runs-on: ubuntu-latest
    name: Refresh CDN Cache
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    steps:
      - name: Set up Python environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Tencent Cloud CLI
        run: |
          curl --fail --location --silent --show-error \
            --output tccli-3.1.194.1-py2.py3-none-any.whl \
            https://files.pythonhosted.org/packages/db/75/0cc24c0bc1fee2d88ebde777bea01f57a8f5b271eee9fff20f662e5ba32e/tccli-3.1.194.1-py2.py3-none-any.whl
          printf '%s  %s\n' '8d2ab8f4111c5a770aa7d98cbbf01a0cdc378dbecee5ba3e5836312dc12c0ba3' tccli-3.1.194.1-py2.py3-none-any.whl | sha256sum --check
          pipx install ./tccli-3.1.194.1-py2.py3-none-any.whl

      - name: Purge production CDN cache
        run: tccli cdn PurgePathCache --Paths '["https://docs-download.pingcap.com/media/images/tidb-in-kubernetes/"]' --FlushType delete
