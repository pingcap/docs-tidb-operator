name: Trigger docs site update

on:
  push:
    branches:
      - main
      - release-1.0
      - release-1.1
      - release-1.2
      - release-1.3
      - release-1.4
      - release-1.5
      - release-1.6
      - release-2.0

permissions: {}

jobs:
  trigger:
    # Configure this environment and migrate its secret before merging.
    environment: docs-publish
    runs-on: ubuntu-latest

    steps:
      - name: Extract sha
        id: extract
        shell: bash
        run: |
          echo "sha=$(sha=${{ github.sha }}; echo ${sha:0:6})" >> "$GITHUB_OUTPUT"

      - name: trigger docs-staging workflow
        env:
          DOCS_STAGING: ${{ secrets.DOCS_STAGING }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          payload=$(jq -n --arg repo "$REPOSITORY" --arg branch "$BRANCH" \
            '{ref: "main", inputs: {full: "false", repo: $repo, branch: $branch}}')
          curl \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token $DOCS_STAGING" \
          https://api.github.com/repos/pingcap/docs-staging/actions/workflows/update.yml/dispatches \
          -d "$payload"
